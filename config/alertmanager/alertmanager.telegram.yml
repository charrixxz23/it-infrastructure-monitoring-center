global:
  resolve_timeout: 5m

route:
  receiver: incident-logger
  group_by: [alertname, instance, mountpoint, source]
  group_wait: 3s
  group_interval: 5s
  repeat_interval: 4h
  routes:
    # This allowlist intentionally contains only the seven existing home-network
    # alert rules. Keep it synchronized with config/prometheus/rules/home-network.yml.
    - receiver: telegram-home-network
      matchers:
        - source="home-network"
        - alertname=~"^(BlackboxExporterDown|BlackboxExporterTargetMissing|HomeDNSResolutionUnavailable|HomeInternetHTTPSUnavailable|HomeProbeExecutionError|HomeRouterTargetMissing|HomeRouterUnavailable)$"
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      continue: true
    # Preserve the existing Incident Logger delivery and timing for the same alerts.
    - receiver: incident-logger
      matchers:
        - source="home-network"
        - alertname=~"^(BlackboxExporterDown|BlackboxExporterTargetMissing|HomeDNSResolutionUnavailable|HomeInternetHTTPSUnavailable|HomeProbeExecutionError|HomeRouterTargetMissing|HomeRouterUnavailable)$"
      group_wait: 3s
      group_interval: 5s
      repeat_interval: 4h

receivers:
  - name: incident-logger
    webhook_configs:
      - url: http://incident-logger:8080/webhook
        send_resolved: true
  - name: telegram-home-network
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: '{{ template "telegram.home_network.message" . }}'

templates:
  - /etc/alertmanager/templates/telegram-home-network.tmpl
