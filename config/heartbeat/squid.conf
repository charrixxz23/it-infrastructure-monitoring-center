# HTTPS CONNECT proxy for the optional ITMC heartbeat only.
# Squid receives the CONNECT hostname and port, never the encrypted Ping URL path.
visible_hostname itmc-heartbeat-egress-proxy
http_port 172.31.255.250:3128

# The fixed private address belongs only to heartbeat-agent's isolated network endpoint.
acl heartbeat_agent src 172.31.255.251/32
acl CONNECT method CONNECT
acl healthchecks_port port 443
# -n disables reverse-DNS lookups; only this exact hostname is accepted.
acl healthchecks_host dstdomain -n hc-ping.com

# Reject private, loopback, link-local, shared, documentation, multicast and reserved
# destinations in both address families, including DNS results for the allowed name.
acl forbidden_destination dst \
  0.0.0.0/8 \
  10.0.0.0/8 \
  100.64.0.0/10 \
  127.0.0.0/8 \
  169.254.0.0/16 \
  172.16.0.0/12 \
  192.0.0.0/24 \
  192.0.2.0/24 \
  192.168.0.0/16 \
  198.18.0.0/15 \
  198.51.100.0/24 \
  203.0.113.0/24 \
  224.0.0.0/4 \
  240.0.0.0/4 \
  ::/128 \
  ::1/128 \
  ::ffff:0:0/96 \
  fc00::/7 \
  fe80::/10 \
  ff00::/8 \
  2001:db8::/32

# Order matters: reject client, method, port and hostname before resolving the
# destination range. The IP-literal request never matches the -n exact hostname ACL.
http_access deny !heartbeat_agent
http_access deny !CONNECT
http_access deny !healthchecks_port
http_access deny !healthchecks_host
http_access deny forbidden_destination
http_access allow heartbeat_agent CONNECT healthchecks_host healthchecks_port
http_access deny all

# No caching or request access logs. CONNECT keeps the secret path inside end-to-end TLS.
cache deny all
access_log none
cache_store_log none
cache_log /dev/null
logfile_rotate 0
cache_effective_user proxy
